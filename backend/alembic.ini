[alembic]
script_location = migrations

# Zero-padded numeric prefix plus a slug, so `ls versions/` reads in order.
# Dates are deliberately absent: a migration's identity is its position in the
# dependency chain, not the day someone happened to write it.
file_template = %%(rev)s_%%(slug)s

prepend_sys_path = .
path_separator = os

# The URL is assembled from environment variables in env.py via pydantic-settings.
# Leaving it empty here means the password is never written to a committed file.
sqlalchemy.url =

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
