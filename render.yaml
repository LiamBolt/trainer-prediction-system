# Render Blueprint — Trainer Prediction System.
# https://render.com/docs/blueprint-spec
#
# This file lives at the REPOSITORY ROOT, one level above `backend/` and
# `frontend/`. Render reads it from the root and builds the backend from the
# Dockerfile inside `backend/` (see dockerContext / dockerfilePath below).
#
# TWO services are declared: the backend (Docker web service) and the frontend
# (static site built from ./frontend). One Blueprint apply brings up both. If you
# only see the backend on Render, it is because an older render.yaml declared only
# the backend — re-sync the Blueprint after pushing this file.
#
# The database is deliberately NOT declared here: it lives on Supabase, and its
# connection string is a secret entered in the Render dashboard (see
# backend/DEPLOYMENT.md), never committed.
#
# What is safe to commit vs. what is a dashboard secret:
#   generateValue: true  → Render mints a strong random value and stores it (JWT key)
#   sync: false          → you type the value into the dashboard once; it never enters git
#   value: ...           → plain configuration, safe in the open

services:
  - type: web
    name: tps-backend
    runtime: docker
    # Paths are relative to this file (the repo root), so both point into backend/.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free                    # bump to starter/standard for always-on + a shell
    region: oregon                # pick the region nearest your Supabase project
    healthCheckPath: /health/ready
    # Migrations run once from your laptop against Supabase (backend/DEPLOYMENT.md),
    # so nothing migrates on deploy by default — matching the "a human runs Alembic"
    # rule (B12). On a paid instance you may instead uncomment this to migrate before
    # each release:
    # preDeployCommand: alembic upgrade head
    envVars:
      - key: ENVIRONMENT
        value: production         # turns on the weak-JWT-secret refusal and prod error rendering

      # The database. Paste your Supabase **Session pooler** URL here in the dashboard.
      # It MUST be the pooler host (aws-0-<region>.pooler.supabase.com), NOT the direct
      # db.<ref>.supabase.co host — the direct host is IPv6-only and Render cannot reach it.
      - key: DATABASE_URL
        sync: false

      # Supabase's pooler presents a certificate signed by Supabase's own CA, which the
      # system trust store does not carry — so a verifying TLS handshake fails with
      # "self-signed certificate in certificate chain". This is exactly why Supabase's
      # own connection strings use sslmode=require (encrypt, do not verify). The traffic
      # is still encrypted; verification is off. To pin instead, add Supabase's CA cert
      # and remove this — see backend/DEPLOYMENT.md.
      - key: DB_SSL_INSECURE
        value: "true"

      # Render generates a strong signing key and keeps it. Never set this by hand and
      # never commit one — a shared JWT key means every token in the system is forgeable.
      - key: JWT_SECRET_KEY
        generateValue: true

      # The exact origin(s) the frontend is served from, comma-separated, no trailing
      # slash, e.g. https://tps-frontend.onrender.com — never '*' (credentials forbid it).
      - key: CORS_ORIGINS
        sync: false

      # Conservative pool for a managed database's connection budget. Supabase's free
      # tier is generous through the pooler, but there is no reason to hold 30 connections.
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"

      - key: LOG_LEVEL
        value: INFO
      - key: APP_VERSION
        value: "1.0.0"
      # Render injects RENDER_GIT_COMMIT automatically; config reads it for /version.

  # ── Frontend: static site (React + Vite) ──────────────────────────────────
  # Built from ./frontend and published as static files. THIS is the service whose
  # absence meant "only the backend is running" — without it, the Blueprint hosts
  # nothing but the API.
  - type: web
    name: tps-frontend
    runtime: static
    # Build from the frontend/ subdirectory; publish its dist/ output (repo-root
    # relative, so it is unambiguous regardless of working-directory semantics).
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: false
    # Single-page app: every path serves index.html so React Router handles routing
    # client-side. Without this, refreshing /dashboard would 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # The backend's PUBLIC URL plus the API prefix. The app's axios baseURL is this
      # value and endpoints are written as /auth/login, /trainers, … so it MUST end in
      # /api/v1 (the backend serves the API there). Set in the dashboard to e.g.
      # https://tps-backend.onrender.com/api/v1  — use YOUR backend's actual URL.
      - key: VITE_API_URL
        sync: false
      # Live mode: call the real backend, not the in-browser mock adapter.
      - key: VITE_USE_MOCKS
        value: "false"
      - key: VITE_APP_VERSION
        value: "1.0.0"
      # Vite 5 + this toolchain build cleanly on Node 20.
      - key: NODE_VERSION
        value: "20"
